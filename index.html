<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Card Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#182430; --ink2:#5a6a7a; --ink3:#8b98a5;
  --bg:#f7f6f3; --card:#ffffff; --line:#e7e2d8;
  --bar:rgba(255,255,255,.95); --field:#efece5; --mixbase:#ffffff;
  --navy:#0a2540; --navy2:#0e3a5f; --gold:#9a5f08; --goldbg:#faf1de;
  --red:#c8102e; --amber:#b45309; --green:#0a6c4f;
  --r:10px;
}
[data-theme="dark"]{
  --ink:#e9edf2; --ink2:#a7b3c0; --ink3:#6d7a88;
  --bg:#10151b; --card:#1a222c; --line:#2b3644;
  --bar:rgba(20,27,36,.95); --field:#232f3d; --mixbase:#1a222c;
  --navy:#123a5e; --navy2:#1a4a75; --gold:#e0a458; --goldbg:#2b2113;
  --red:#f0526a; --amber:#e8a33d; --green:#3fb97f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.wrap{max-width:980px; margin:0 auto; padding:0 16px}

/* ---------- utility bar ---------- */
.utilbar{position:sticky; top:0; z-index:50; background:var(--bar);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);}
.utilbar .wrap{display:flex; align-items:center; justify-content:space-between; padding-top:8px; padding-bottom:8px}
.updated{font-size:12.5px; color:var(--ink2); font-weight:600}
.ubtns{display:flex; gap:8px}
.ubtn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
  width:32px; height:32px; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center}
.ubtn:active{transform:scale(.94)}

/* ---------- hero / merchant lookup ---------- */
.hero{background:linear-gradient(135deg, var(--navy), var(--navy2)); color:#fff; margin-bottom:16px}
.hero .wrap{padding-top:24px; padding-bottom:22px}
.hero h1{margin:0 0 4px; font-size:24px; font-weight:700; letter-spacing:-.01em}
.hero .tracked{font-size:13px; color:#c8d6e4; font-weight:500; margin-bottom:14px}
.hero .tracked b{color:#f0b35e; font-weight:700}
.searchbox{position:relative; max-width:560px}
.searchbox input{width:100%; padding:12px 40px 12px 40px; font-size:15px; color:#182430;
  background:#fff; border:1px solid transparent; border-radius:10px; outline:none;
  font-family:inherit}
.searchbox input::placeholder{color:#8b98a5}
.searchbox .sicon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#8b98a5; pointer-events:none; display:flex}
.searchbox .sclear{position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:0; background:transparent; color:#8b98a5; font-size:20px; line-height:1;
  width:30px; height:30px; border-radius:50%; cursor:pointer; display:none}
.searchbox .sclear.on{display:block}

/* ---------- eligibility toolbar ---------- */
.eligbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:2px 0 18px}
.eligbar .lab{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
.seg{display:inline-flex; background:var(--field); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; color:var(--ink2); font-family:inherit;
  font-size:13px; font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer}
.seg button.on{background:var(--navy); color:#fff}
[data-theme="dark"] .seg button.on{background:var(--gold); color:#182430}

/* ---------- sections ---------- */
.sec{margin:22px 0}
.sec-h{display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px}
.sec-h h2{font-size:17px; font-weight:700; margin:0; letter-spacing:-.01em; color:var(--ink)}

/* ---------- priority stats + moves ---------- */
.pstats{display:flex; gap:0; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; margin-bottom:12px}
.pstat{flex:1; padding:12px 14px; text-align:left}
.pstat + .pstat{border-left:1px solid var(--line)}
.pstat b{display:block; font-size:21px; font-weight:700; letter-spacing:-.02em}
.pstat span{font-size:11.5px; color:var(--ink2); font-weight:600}
.pstat.p-end b{color:var(--red)} .pstat.p-new b{color:var(--gold)} .pstat.p-held b{color:var(--navy)}
[data-theme="dark"] .pstat.p-held b{color:var(--ink)}
.moves{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:6px 14px; margin-bottom:12px}
.move{padding:9px 0; border-bottom:1px dashed var(--line)}
.move:last-child{border-bottom:0}
.move .mt{font-weight:600; font-size:13.5px; color:var(--ink)}
.move .md{font-size:12.5px; color:var(--ink2); margin-top:1px}

/* ---------- collapsible queues ---------- */
.queue{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:12px; overflow:hidden}
.qhead{width:100%; display:flex; align-items:center; gap:10px; padding:13px 14px;
  background:none; border:0; cursor:pointer; text-align:left; color:var(--ink); font-family:inherit}
.qhead .qt{flex:1; font-weight:700; font-size:15px}
.qhead .qcount{font-size:11.5px; font-weight:700; background:var(--goldbg); color:var(--gold);
  border-radius:999px; padding:2px 9px; white-space:nowrap}
.qhead .chev{color:var(--ink3); font-size:18px; transition:transform .18s}
.queue.open .qhead .chev{transform:rotate(90deg)}
.qbody{display:none; padding:2px 12px 12px}
.queue.open .qbody{display:block}
.qbody .card{margin-bottom:8px}

/* ---------- promo cards (app style) ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  margin-bottom:10px; overflow:hidden; color:var(--ink)}
.cardhead{width:100%; text-align:left; background:none; border:0; padding:12px 14px;
  cursor:pointer; display:flex; gap:12px; align-items:flex-start; color:var(--ink); font-family:inherit}
.tile{flex:0 0 40px; width:40px; height:40px; border-radius:9px; background:var(--bc,#5b6470);
  color:#fff; font-size:13px; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center}
.cmain{flex:1; min-width:0}
.cardhead .ct{display:block; font-weight:600; font-size:14.5px; line-height:1.35; color:var(--ink)}
.tagnew{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; color:#fff;
  background:var(--red); border-radius:5px; padding:1px 6px; vertical-align:2px; margin-right:2px}
.cardhead .ones{display:block; font-size:13px; color:var(--ink2); margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card.q .cardhead .ones{-webkit-line-clamp:1}
.card.open .cardhead .ones{display:block; -webkit-line-clamp:unset}
.cmeta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:7px; font-size:12px}
.bname{font-weight:700}
.dlab{color:var(--ink2); font-weight:600}
.dlab.urgent{color:var(--red)} .dlab.soon{color:var(--amber)}
.fit{font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px}
.fit.works{background:#e3f2ec; color:var(--green)}
.fit.excl{background:#fde8ea; color:var(--red)}
[data-theme="dark"] .fit.works{background:#14352a} [data-theme="dark"] .fit.excl{background:#3d1a20}
.eligline{display:block; font-size:12px; color:var(--ink2); margin-top:5px}
.cardhead .chev{flex:0 0 auto; color:var(--ink3); font-size:18px; line-height:1.2; transition:transform .18s}
.card.open .cardhead .chev{transform:rotate(90deg)}
.cardbody{display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .22s ease, opacity .18s ease}
.cardbody .cbin{overflow:hidden; min-height:0}
.card.open .cardbody{grid-template-rows:1fr; opacity:1}
.card.open .cardbody .cbin{padding:2px 14px 14px 66px}
.kv{margin-bottom:8px; font-size:13.5px}
.kv .k{display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); margin-bottom:1px}
.kv .v{color:var(--ink2)}
.cardbody a{color:var(--gold); font-weight:600; text-decoration:none}
.cardbody a:hover{text-decoration:underline}
.links{display:flex; gap:16px; flex-wrap:wrap; margin-top:4px}
.src{font-size:11.5px; color:var(--ink3); margin-top:8px}
.vowarn{font-size:12.5px; color:var(--amber); font-weight:600}

/* ---------- browse directory ---------- */
.dirhead{display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px}
.dirhead h2{font-size:17px; font-weight:700; margin:0}
.dirbtn{border:1px solid var(--navy); background:var(--navy); color:#fff; font-family:inherit;
  font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px; cursor:pointer}
.dirbtn.open{background:transparent; color:var(--navy)}
[data-theme="dark"] .dirbtn.open{color:var(--ink); border-color:var(--line)}
.dirbody{display:none}
.dirbody.on{display:block; animation:fadein .18s ease}
.cattabs{display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 12px}
.cattab{border:1px solid var(--line); background:var(--card); color:var(--ink2); font-family:inherit;
  font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer}
.cattab.on{background:var(--goldbg); border-color:var(--gold); color:var(--gold)}
.ftools{margin:0 0 4px}
.bchips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px}
.bchip{border:1px solid var(--line); background:var(--card); color:var(--ink2); font-family:inherit;
  font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer}
.bchip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.bchip.clear{border-style:dashed; color:var(--red)}
.bchip.my{border-color:var(--green); color:var(--green)}
.bchip.my.on{background:var(--green); border-color:var(--green); color:#fff}
.frow{display:flex; align-items:center; justify-content:space-between; margin:6px 2px 10px}
.fcount{font-size:12.5px; color:var(--ink2); font-weight:600}
.fsort{font-size:12.5px; font-weight:600; color:var(--ink); background:var(--card); font-family:inherit;
  border:1px solid var(--line); border-radius:9px; padding:6px 8px}
.fhelp{font-size:11.5px; color:var(--ink3); margin:0 2px 12px}
.expandall{font-size:12.5px; font-weight:600; color:var(--gold); background:none; border:0; cursor:pointer; padding:6px 8px; font-family:inherit}

/* ---------- collapsible groups (directory) ---------- */
.group{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden}
.ghead{width:100%; display:flex; align-items:center; gap:10px; padding:13px 14px;
  background:none; border:0; cursor:pointer; text-align:left; color:var(--ink); font-family:inherit}
.ghead .gt{flex:1; font-weight:600; font-size:14.5px; color:var(--ink)}
.ghead .gcount{font-size:11.5px; font-weight:700; background:var(--field); color:var(--ink2);
  border-radius:999px; padding:2px 9px; white-space:nowrap}
.ghead .chev{color:var(--ink3); font-size:18px; transition:transform .18s}
.group.open .ghead .chev{transform:rotate(90deg)}
.gbody{display:none; padding:2px 10px 10px}
.group.open .gbody{display:block}
.gbody .card{margin-bottom:8px}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--bar); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tabs{max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.tabbtn{position:relative; border:0; background:none; padding:8px 2px 9px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:600; color:var(--ink3); font-family:inherit}
.tabbtn svg{width:21px; height:21px}
.tabbtn.on{color:var(--gold)}
.tabbtn .bdg{position:absolute; top:2px; left:calc(50% + 2px); font-size:9.5px; font-weight:700;
  color:var(--ink2); background:var(--field); border:1px solid var(--line);
  border-radius:999px; min-width:17px; height:15px; line-height:13px; text-align:center; padding:0 4px}
.tabbtn.on .bdg{color:var(--gold); border-color:var(--gold)}

.empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--r);
  padding:26px 18px; text-align:center; color:var(--ink3); font-size:13.5px}
.stale{background:#fef3e2; border:1px solid #f3d9a8; color:#7c4a03; border-radius:10px;
  padding:10px 14px; margin:12px 0 0; font-size:13px; font-weight:600}
[data-theme="dark"] .stale{background:#2b2113; border-color:#5a451f; color:#e8a33d}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="utilbar">
  <div class="wrap">
    <div class="updated" id="updated"></div>
    <div class="ubtns">
      <button class="ubtn" id="reloadbtn" aria-label="Reload page" title="Reload">↻</button>
      <button class="ubtn" id="themebtn" aria-label="Toggle dark mode" title="Dark mode">🌙</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Where are you spending?</h1>
    <div class="tracked" id="tracked"></div>
    <div class="searchbox">
      <label class="vh" for="q">Search merchants, banks and offers</label>
      <span class="sicon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="q" type="search" placeholder="Search merchants, banks, offers…" autocomplete="off" aria-label="Search merchants, banks and offers">
      <button type="button" class="sclear" id="qclear" aria-label="Clear search">&times;</button>
    </div>
  </div>
</section>

<div class="wrap"><div id="stalebanner" class="stale" hidden></div></div>

<main class="wrap">
  <div class="eligbar" id="eligbar">
    <span class="lab">Card eligibility</span>
    <div class="seg" role="group" aria-label="Card eligibility filter">
      <button id="fit-works" class="on">Works with my cards</button>
      <button id="fit-excl">Show excluded</button>
    </div>
  </div>

  <section class="sec" id="sec-results" hidden>
    <div class="sec-h"><h2 id="results-h">Results</h2></div>
    <div id="results"></div>
  </section>

  <div id="briefing-main">
    <section class="sec" id="sec-priority" style="margin-top:4px">
      <div class="sec-h"><h2>What needs attention first</h2></div>
      <div class="pstats">
        <div class="pstat p-end"><b id="ps-end">0</b><span>ends this week</span></div>
        <div class="pstat p-new"><b id="ps-new">0</b><span>new this week</span></div>
        <div class="pstat p-held"><b id="ps-held">0</b><span>held-bank offers</span></div>
      </div>
      <div class="moves" id="moves"></div>
      <div class="queue open" id="q-ending">
        <button class="qhead" aria-expanded="true"><span class="qt">Ends this week</span><span class="qcount" id="qc-ending">0</span><span class="chev">›</span></button>
        <div class="qbody" id="queue-ending"></div>
      </div>
      <div class="queue open" id="q-fresh">
        <button class="qhead" aria-expanded="true"><span class="qt">New this week</span><span class="qcount" id="qc-fresh">0</span><span class="chev">›</span></button>
        <div class="qbody" id="queue-fresh"></div>
      </div>
    </section>

    <section class="sec" id="sec-directory">
      <div class="dirhead"><h2>Browse all offers</h2><button class="dirbtn" id="dirbtn">Open directory</button></div>
      <div class="dirbody" id="dirbody">
        <div class="cattabs" id="cattabs"></div>
        <div class="ftools">
          <div class="bchips" id="dir-chips"></div>
          <div class="frow"><div class="fcount" id="dir-count"></div>
            <div style="display:flex; align-items:center; gap:4px">
              <button class="expandall" id="dir-expand" hidden>Expand all</button>
              <select class="fsort" id="dir-sort" aria-label="Sort offers">
                <option value="soon">Soonest first</option><option value="az">A–Z</option>
              </select>
            </div></div>
          <p class="fhelp" id="dir-help"></p>
        </div>
        <div id="dir-list"></div>
      </div>
    </section>
  </div>
</main>

<nav class="tabbar" aria-label="Digest sections">
  <div class="tabs" role="tablist">
    <button class="tabbtn on" data-tab="briefing" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5z"/><path d="M17 8h2a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7"/></svg>Briefing<span class="bdg" id="bdg-briefing"></span></button>
    <button class="tabbtn" data-tab="dining" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7M4.5 3v4a2.5 2.5 0 0 0 5 0V3M7 10v11M17 3c-1.7 1-2.5 3-2.5 5.5 0 2 1 3 2.5 3v9.5"/></svg>Dining<span class="bdg" id="bdg-dining"></span></button>
    <button class="tabbtn" data-tab="movies" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>Movies<span class="bdg" id="bdg-movies"></span></button>
    <button class="tabbtn" data-tab="travel" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Travel<span class="bdg" id="bdg-travel"></span></button>
    <button class="tabbtn" data-tab="signup" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8s-4.5.2-4.5-2.2C7.5 3.6 11 3.4 12 8zM12 8s4.5.2 4.5-2.2C16.5 3.6 13 3.4 12 8z"/></svg>Sign-up<span class="bdg" id="bdg-signup"></span></button>
  </div>
</nav>

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function bankShort(b){ return BANKS[b] || b; }
function unverified(o){ return /^dates unverified$/i.test(String((o&&o.dt)||"")); }
function parseEnd(s){
  var m = /(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/.exec(String(s||"").split(/(?:–|—|\bto\b|-)/).pop());
  if(!m) return null;
  var mi = MON[m[2].slice(0,3).toLowerCase()];
  if(mi==null) return null;
  var d = new Date(+m[3], mi, +m[1]); d.setHours(0,0,0,0); return d;
}
function today0(){ var t = new Date(); t.setHours(0,0,0,0); return t; }
function daysLeft(dt){
  var d = parseEnd(dt); if(!d) return null;
  return Math.round((d - today0()) / 864e5);
}
function dateLabel(o){
  if(unverified(o)) return "";
  var dl = daysLeft(o.dt); if(dl == null) return "";
  var cls = dl <= 7 ? "urgent" : dl <= 30 ? "soon" : "";
  var txt;
  if(dl < 0) txt = "Ended";
  else if(dl === 0) txt = "Ends today";
  else if(dl === 1) txt = "Ends tomorrow";
  else if(dl <= 14) txt = dl + " days left";
  else { var d = parseEnd(o.dt); txt = "Ends " + d.getDate() + " " + MONS[d.getMonth()]; }
  return '<span class="dlab ' + cls + '">' + esc(txt) + "</span>";
}
function oneLiner(d){ return String(d||"").split(/(?<=[.!?])\s|;/)[0].slice(0,140); }
function initials(b){
  var w = String(b||"").replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean);
  if(!w.length) return "•";
  if(w.length === 1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0] + w[1][0]).toUpperCase();
}
function fitOf(o){
  var ec = o.ec || [];
  if(!ec.length) return null;
  var toks = HELD_TOKENS[o.b];
  if(!toks) return "excluded";
  if(o.vo) toks = toks.filter(function(t){ return t !== "virtual"; });
  for(var i = 0; i < ec.length; i++){
    var el = String(ec[i]).toLowerCase();
    if(el === ("all " + o.b + " cards").toLowerCase()) return "works";
    for(var j = 0; j < toks.length; j++){ if(el.indexOf(toks[j]) > -1) return "works"; }
  }
  return "excluded";
}

var state = {fit:"works", q:"", dirOpen:false, dirCat:"dining", bank:{}, my:{},
  sort:{dining:"soon", movies:"soon", travel:"soon", signup:"az", extra:"soon"}};

function allPromos(){ return DB.dining.concat(DB.movies, DB.travel, DB.signup, DB.extra||[]); }
function fitOK(o){
  var f = fitOf(o);
  return state.fit === "excluded" ? f === "excluded" : f !== "excluded";
}
function matchQ(o, q){
  if(!q) return true;
  var s = (o.t+" "+o.b+" "+o.d).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){ return s.indexOf(w) > -1; });
}
function sortSoon(a, b){
  var da = parseEnd(a.dt), db = parseEnd(b.dt);
  if(da && db) return da - db;
  return da ? -1 : db ? 1 : 0;
}
function sortAZ(a, b){ return String(a.t).localeCompare(String(b.t)); }

function cardHTML(o, inQueue){
  var f = fitOf(o);
  var h = '<article class="card' + (inQueue ? " q" : "") + '" data-t="' + esc(o.t) + '">'
    + '<button class="cardhead" aria-expanded="false">'
    + '<span class="tile" style="--bc:' + (BANKC[o.b]||"#5b6470") + ';background:' + (BANKC[o.b]||"#5b6470") + '">' + esc(initials(o.b)) + '</span>'
    + '<span class="cmain">'
    + '<span class="ct">' + (o.n ? '<span class="tagnew">NEW</span> ' : '') + esc(o.t) + '</span>'
    + '<span class="ones">' + esc(oneLiner(o.d)) + '</span>'
    + '<span class="cmeta"><span class="bname" style="color:' + (BANKC[o.b]||"#5b6470") + '">' + esc(bankShort(o.b)) + '</span>'
    + dateLabel(o)
    + (f === "works" ? '<span class="fit works">Works with my cards</span>' : f === "excluded" ? '<span class="fit excl">Excluded</span>' : '')
    + '</span>'
    + (o.ec && o.ec.length ? '<span class="eligline">💳 ' + esc(o.ec.join(", ")) + '</span>' : '')
    + '</span><span class="chev">›</span></button>'
    + '<div class="cardbody"><div class="cbin">';
  if(!unverified(o)) h += '<div class="kv"><span class="k">Campaign period</span><span class="v">' + esc(o.dt || "NA") + '</span></div>';
  h += '<div class="kv"><span class="k">Offer</span><span class="v">' + esc(o.d) + '</span></div>';
  if(o.vo) h += '<div class="kv"><span class="vowarn">⚠️ Alliance Virtual is not eligible for this offer</span></div>';
  if(o.ec && o.ec.length) h += '<div class="kv"><span class="k">Eligible cards</span><span class="v">' + esc(o.ec.join(", ")) + '</span></div>';
  h += '<div class="links">';
  if(o.l) h += '<a href="' + esc(o.l) + '" target="_blank" rel="noopener">View offer ↗</a>';
  if(o.l2) h += '<a href="' + esc(o.l2) + '" target="_blank" rel="noopener">Compare ↗</a>';
  h += '</div>';
  if(o.s) h += '<div class="src">via ' + esc(o.s) + '</div>';
  h += '</div></div></article>';
  return h;
}

function bindCards(root){
  root.querySelectorAll(".cardhead").forEach(function(btn){
    btn.addEventListener("click", function(){
      var c = btn.closest(".card");
      c.classList.toggle("open");
      btn.setAttribute("aria-expanded", c.classList.contains("open") ? "true" : "false");
    });
  });
}

function renderPriority(){
  var all = allPromos();
  var endW = all.filter(function(o){ var dl = daysLeft(o.dt); return dl != null && dl >= 0 && dl <= 7; });
  var fresh = all.filter(function(o){ return o.n; });
  var held = all.filter(function(o){ return HELD.indexOf(o.b) > -1; });
  document.getElementById("ps-end").textContent = endW.length;
  document.getElementById("ps-new").textContent = fresh.length;
  document.getElementById("ps-held").textContent = held.length;

  var mv = document.getElementById("moves");
  mv.innerHTML = (DB.moves || []).map(function(m){
    return '<div class="move"><div class="mt">' + esc(m.t) + '</div><div class="md">' + esc(m.d) + '</div></div>';
  }).join("");

  var qe = endW.filter(fitOK).sort(sortSoon);
  document.getElementById("qc-ending").textContent = qe.length;
  var qeEl = document.getElementById("queue-ending");
  qeEl.innerHTML = qe.length ? qe.map(function(o){ return cardHTML(o, true); }).join("")
    : '<div class="empty">Nothing ending this week matches the eligibility filter.</div>';
  bindCards(qeEl);

  var qf = fresh.filter(fitOK).sort(sortSoon);
  document.getElementById("qc-fresh").textContent = qf.length;
  var qfEl = document.getElementById("queue-fresh");
  qfEl.innerHTML = qf.length ? qf.map(function(o){ return cardHTML(o, true); }).join("")
    : '<div class="empty">Nothing new matches the eligibility filter.</div>';
  bindCards(qfEl);
}

function dirBanks(cat){ return Array.from(new Set(DB[cat].map(function(o){ return o.b; }))).sort(); }

function renderDirectory(){
  var cat = state.dirCat;
  document.querySelectorAll(".cattab").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-cat") === cat);
  });
  var bs = state.bank[cat] || (state.bank[cat] = {});
  var chips = "";
  dirBanks(cat).forEach(function(b){
    chips += '<button class="bchip' + (bs[b] ? " on" : "") + '" data-b="' + esc(b) + '">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (BANKC[b]||"#5b6470") + ';margin-right:6px"></span>'
      + esc(bankShort(b)) + '</button>';
  });
  chips += '<button class="bchip my' + (state.my[cat] ? " on" : "") + '" data-my="1">✓ My banks</button>';
  if(Object.keys(bs).length || state.my[cat]) chips += '<button class="bchip clear" data-clear="1">✕ Clear</button>';
  document.getElementById("dir-chips").innerHTML = chips;

  var arr = DB[cat].filter(fitOK);
  if(state.my[cat]) arr = arr.filter(function(o){ return HELD.indexOf(o.b) > -1; });
  if(Object.keys(bs).length) arr = arr.filter(function(o){ return bs[o.b]; });
  arr.sort(state.sort[cat] === "az" ? sortAZ : sortSoon);
  document.getElementById("dir-sort").value = state.sort[cat];
  document.getElementById("dir-count").textContent = arr.length + " shown · " + DB[cat].length + " tracked";
  document.getElementById("dir-help").textContent = HELP[cat] || "";
  document.getElementById("dir-expand").hidden = cat !== "dining";

  var list = document.getElementById("dir-list");
  if(!arr.length){ list.innerHTML = '<div class="empty">No promos match. Try clearing the filters.</div>'; return; }
  var groupBy = cat === "dining" ? "t" : cat === "signup" ? "b" : null;
  if(groupBy){
    var groups = {}, order = [];
    arr.forEach(function(o){ var g = o[groupBy]; if(!groups[g]){ groups[g] = []; order.push(g); } groups[g].push(o); });
    var h = "";
    order.forEach(function(g){
      var items = groups[g].slice().sort(sortSoon);
      var open = cat === "signup";
      h += '<div class="group' + (open ? " open" : "") + '">'
        + '<button class="ghead" aria-expanded="' + (open ? "true" : "false") + '">'
        + '<span class="gt">' + esc(g) + '</span>'
        + '<span class="gcount">' + items.length + '</span>' + dateLabel(items[0])
        + '<span class="chev">›</span></button>'
        + '<div class="gbody">' + items.map(function(o){ return cardHTML(o, false); }).join("") + '</div></div>';
    });
    list.innerHTML = h;
    list.querySelectorAll(".ghead").forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = btn.closest(".group"); g.classList.toggle("open");
        btn.setAttribute("aria-expanded", g.classList.contains("open") ? "true" : "false");
      });
    });
  } else {
    list.innerHTML = arr.map(function(o){ return cardHTML(o, false); }).join("");
  }
  bindCards(list);
}

function renderSearch(){
  var q = state.q.trim();
  var rs = document.getElementById("sec-results"), main = document.getElementById("briefing-main");
  if(!q){ rs.hidden = true; main.style.display = ""; return; }
  rs.hidden = false; main.style.display = "none";
  document.getElementById("results-h").textContent = 'Results for "' + q + '"';
  var hits = allPromos().filter(function(o){ return fitOK(o) && matchQ(o, q); }).sort(sortSoon).slice(0, 40);
  var rl = document.getElementById("results");
  rl.innerHTML = hits.length ? hits.map(function(o){ return cardHTML(o, false); }).join("")
    : '<div class="empty">No promos match "' + esc(q) + '".</div>';
  bindCards(rl);
}

function renderBadges(){
  document.getElementById("bdg-briefing").textContent = allPromos().length;
  CATS.forEach(function(c){
    var el = document.getElementById("bdg-" + c[0]);
    if(el) el.textContent = DB[c[0]].length;
  });
  var excl = allPromos().filter(function(o){ return fitOf(o) === "excluded"; }).length;
  document.getElementById("fit-excl").textContent = "Show excluded " + excl;
}

function syncTabs(){
  var active = state.dirOpen && state.dirCat !== "extra" ? state.dirCat : "briefing";
  document.querySelectorAll(".tabbtn").forEach(function(b){
    var on = b.getAttribute("data-tab") === active;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
}

function renderAll(){
  renderPriority(); renderBadges();
  if(state.dirOpen) renderDirectory();
  renderSearch(); syncTabs();
}

function openDirectory(cat){
  state.dirOpen = true; state.dirCat = cat;
  document.getElementById("dirbody").classList.add("on");
  var btn = document.getElementById("dirbtn");
  btn.textContent = "Close directory"; btn.classList.add("open");
  renderDirectory(); syncTabs();
  document.getElementById("sec-directory").scrollIntoView({behavior:"smooth", block:"start"});
}
function closeDirectory(){
  state.dirOpen = false;
  document.getElementById("dirbody").classList.remove("on");
  var btn = document.getElementById("dirbtn");
  btn.textContent = "Open directory"; btn.classList.remove("open");
  syncTabs();
}

document.querySelectorAll(".tabbtn").forEach(function(b){
  b.addEventListener("click", function(){
    var t = b.getAttribute("data-tab");
    if(t === "briefing"){ window.scrollTo({top:0, behavior:"smooth"}); syncTabs(); }
    else openDirectory(t);
  });
});
document.getElementById("dirbtn").addEventListener("click", function(){
  if(state.dirOpen) closeDirectory(); else openDirectory(state.dirCat);
});
document.querySelectorAll(".qhead").forEach(function(btn){
  btn.addEventListener("click", function(){
    var q = btn.closest(".queue"); q.classList.toggle("open");
    btn.setAttribute("aria-expanded", q.classList.contains("open") ? "true" : "false");
  });
});
document.getElementById("fit-works").addEventListener("click", function(){
  state.fit = "works";
  document.getElementById("fit-works").classList.add("on");
  document.getElementById("fit-excl").classList.remove("on");
  renderAll();
});
document.getElementById("fit-excl").addEventListener("click", function(){
  state.fit = "excluded";
  document.getElementById("fit-excl").classList.add("on");
  document.getElementById("fit-works").classList.remove("on");
  renderAll();
});
var qin = document.getElementById("q"), qclear = document.getElementById("qclear");
qin.addEventListener("input", function(){
  state.q = qin.value;
  qclear.classList.toggle("on", !!qin.value);
  renderSearch();
});
qclear.addEventListener("click", function(){
  qin.value = ""; state.q = ""; qclear.classList.remove("on"); renderSearch(); qin.focus();
});
document.getElementById("dir-sort").addEventListener("change", function(){
  state.sort[state.dirCat] = this.value; renderDirectory();
});
document.getElementById("dir-expand").addEventListener("click", function(){
  var list = document.getElementById("dir-list");
  var closed = list.querySelector(".group:not(.open)");
  list.querySelectorAll(".group").forEach(function(g){
    g.classList.toggle("open", !!closed);
    var h = g.querySelector(".ghead"); if(h) h.setAttribute("aria-expanded", !!closed);
  });
  this.textContent = closed ? "Collapse all" : "Expand all";
});
document.addEventListener("click", function(e){
  var ct = e.target.closest(".cattab");
  if(ct){ state.dirCat = ct.getAttribute("data-cat"); renderDirectory(); syncTabs(); return; }
  var c = e.target.closest(".bchip"); if(!c) return;
  var cat = state.dirCat;
  if(c.hasAttribute("data-clear")){ state.bank[cat] = {}; state.my[cat] = false; }
  else if(c.hasAttribute("data-my")){ state.my[cat] = !state.my[cat]; }
  else { var bb = c.getAttribute("data-b"); var bs = state.bank[cat] || (state.bank[cat] = {});
    if(bs[bb]) delete bs[bb]; else bs[bb] = 1; }
  renderDirectory();
});

(function init(){
  var m = DB.meta || {};
  try{ var th = localStorage.getItem("mb-theme"); if(th === "dark") document.documentElement.setAttribute("data-theme", "dark"); }catch(e){}
  var tbtn = document.getElementById("themebtn");
  function syncTbtn(){ tbtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙"; }
  syncTbtn();
  tbtn.addEventListener("click", function(){
    var dark = document.documentElement.getAttribute("data-theme") !== "dark";
    if(dark) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    try{ localStorage.setItem("mb-theme", dark ? "dark" : ""); }catch(e){}
    syncTbtn();
  });
  document.getElementById("reloadbtn").addEventListener("click", function(){ location.reload(); });
  document.getElementById("updated").textContent = "Updated " + (m.date || "") + (m.updated ? ", " + m.updated : "");
  document.getElementById("tracked").innerHTML = "<b>" + allPromos().length + "</b> offers tracked today";
  var t0 = today0(), stale = false;
  if(m.date){
    var p = String(m.date).split(" ");
    var mi = MONS.indexOf(p[1]);
    if(p.length === 3 && mi > -1){
      var dd = new Date(+p[2], mi, +p[0]);
      if(!isNaN(dd) && dd < t0) stale = true;
    }
  }
  if(stale){
    var bnr = document.getElementById("stalebanner");
    bnr.hidden = false;
    bnr.textContent = "⚠️ This digest is from " + m.date + " — today's run hasn't landed yet.";
  }
  document.getElementById("cattabs").innerHTML = CATS.map(function(c){
    return '<button class="cattab" data-cat="' + c[0] + '">' + c[1] + '</button>';
  }).join("");
  renderAll();
})();
</script>
</body>
</html>
